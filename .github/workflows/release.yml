# Release: publishes bizdays-rs to PyPI and bizdays to crates.io.
#
# - Runs ONLY by hand (workflow_dispatch) and waits for approval in the
#   `release` environment (Settings > Environments > release > required reviewers).
# - Uses trusted publishing (OIDC), no tokens. It will NOT work until the
#   trusted publishers are configured:
#     * PyPI:      https://pypi.org/manage/account/publishing/ (project bizdays-rs,
#                  workflow release.yml, environment release)
#     * crates.io: crate settings > Trusted Publishing (crate bizdays,
#                  workflow release.yml, environment release); the first
#                  publish of a new crate must be done by hand.
name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: x86_64
          manylinux: auto
          args: --release --out dist -m py-bizdays/Cargo.toml
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist -m py-bizdays/Cargo.toml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://pypi.org/project/bizdays-rs/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  crates-io:
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://crates.io/crates/bizdays
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - run: cargo publish -p bizdays
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
