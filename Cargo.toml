[workspace]
resolver = "3"
members = ["crates/bizdays", "py-bizdays"]
default-members = ["crates/bizdays"]

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/0b10n3/bizdays-rs"
homepage = "https://0b10n3.github.io/bizdays-rs/"
authors = ["0b10n3 <silvasmath@gmail.com>"]

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = true
codegen-units = 1
